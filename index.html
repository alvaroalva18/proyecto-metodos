<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Metodos Numericos</title>
    <!-- Librerias Matematicas y Graficas Estables -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: sans-serif; margin: 0; padding: 20px; }
        header { background-color: #1f2937; padding: 15px; border-bottom: 2px solid #374151; border-radius: 8px; margin-bottom: 20px; }
        h1 { color: #3b82f6; margin: 0; font-size: 24px; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 2fr; } }
        .panel { background-color: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: not-allowed; opacity: 0.5; }
        .btn-blue { background-color: #2563eb; }
        .btn-emerald { background-color: #059669; }
        .btn-purple { background-color: #7c3aed; }
        .active { opacity: 1 !important; cursor: pointer !important; }
        .console { background-color: #000; border: 1px solid #374151; padding: 15px; border-radius: 6px; font-family: monospace; color: #34d399; height: 120px; overflow-y: auto; }
        .chart-box { background-color: #111827; border: 1px solid #374151; padding: 10px; border-radius: 6px; height: 260px; }
    </style>
</head>
<body>

    <header>
        <h1>Analizador Numérico de Baterías</h1>
        <p style="margin:5px 0 0 0; font-size:12px; color:#9ca3af;">Proyecto Métodos Numéricos | FIEE - UNMSM</p>
    </header>

    <div class="grid-container">
        <!-- Izquierda -->
        <div class="panel">
            <h3>📂 Cargar Datos Físicos</h3>
            <p style="font-size:13px; color:#9ca3af;">Sube tu archivo .xlsx o .csv (Tiempo vs Voltaje)</p>
            <input type="file" id="excel-file" style="margin-top:10px; color:#f3f4f6;" />
            <p style="font-size:12px; margin-top:10px;">Filas procesadas: <span id="row-count" style="color:#34d399; font-weight:bold;">0</span></p>

            <h3 style="margin-top:30px;">🧮 Algoritmos</h3>
            <button id="btn-interpolacion" class="btn btn-blue" disabled>Interpolación (Lagrange)</button>
            <button id="btn-derivacion" class="btn btn-emerald" disabled>Derivación (Dif. Centradas)</button>
            <button id="btn-integracion" class="btn btn-purple" disabled>Integración (Simpson 1/3)</button>
        </div>

        <!-- Derecha -->
        <div class="panel">
            <h3>📊 Comportamiento de la Celda (V vs t)</h3>
            <div class="chart-box">
                <canvas id="canvasChart"></canvas>
            </div>
            
            <h3 style="margin-top:20px;">🖥️ Consola de Salida</h3>
            <div id="console-output" class="console">
                <p style="color:#6b7280; margin:0;">> Sistema listo. Esperando archivo...</p>
            </div>
        </div>
    </div>

    <script>
        let datosX = [];
        let datosY = [];
        let miGrafico = null;

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                datosX = [];
                datosY = [];
                let procesadoCorrectamente = false;

                // INTENTO 1: Leer como archivo Excel (.xlsx) estructurado
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const datosJson = XLSX.utils.sheet_to_json(worksheet);

                    if (datosJson.length > 0) {
                        datosJson.forEach(fila => {
                            const tiempoKey = Object.keys(fila).find(k => k.toUpperCase().trim() === 'TIEMPO');
                            const voltajeKey = Object.keys(fila).find(k => k.toUpperCase().trim() === 'VOLTAJE');

                            if (tiempoKey && voltajeKey) {
                                const valX = Number(fila[tiempoKey]);
                                const valY = Number(fila[voltajeKey]);
                                if (!isNaN(valX) && !isNaN(valY)) {
                                    datosX.push(valX);
                                    datosY.push(valY);
                                }
                            }
                        });
                        if (datosX.length > 0) procesadoCorrectamente = true;
                    }
                } catch (e) { /* Error silencioso, pasa al intento 2 */ }

                // INTENTO 2: Si fallo el parser de Excel, procesar como texto plano (CSV puro)
                if (!procesadoCorrectamente) {
                    try {
                        const decoder = new TextDecoder();
                        const texto = decoder.decode(evt.target.result);
                        const lineas = texto.split(/\r?\n/);

                        lineas.forEach((linea, index) => {
                            if (index === 0 || linea.trim() === "") return; // Saltar cabecera o vacios
                            const columnas = linea.split(/[,;\t]/); // Detectar comas, punto y coma o tabs
                            if (columnas.length >= 2) {
                                const valX = Number(columnas[0].trim());
                                const valY = Number(columnas[1].trim());
                                if (!isNaN(valX) && !isNaN(valY)) {
                                    datosX.push(valX);
                                    datosY.push(valY);
                                }
                            }
                        });
                        if (datosX.length > 0) procesadoCorrectamente = true;
                    } catch (errText) { /* Error de decodificacion */ }
                }

                // VALIDACIÓN FINAL DE LA CARGA
                if (procesadoCorrectamente && datosX.length > 0) {
                    document.getElementById('row-count').innerText = datosX.length;
                    const consola = document.getElementById('console-output');
                    consola.innerHTML += `<p style="margin:3px 0;">> Archivo cargado con éxito: "${file.name}"</p>`;
                    consola.innerHTML += `<p style="margin:3px 0; color:#3b82f6;">> Se procesaron ${datosX.length} puntos de telemetría.</p>`;

                    document.querySelectorAll('.btn').forEach(btn => {
                        btn.disabled = false;
                        btn.classList.add('active');
                    });

                    actualizarGrafico(datosX, datosY);
                } else {
                    alert("Error: No se lograron mapear las columnas. Asegúrate de que las cabeceras se llamen exactamente 'TIEMPO' y 'VOLTAJE'.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function actualizarGrafico(x, y) {
            const ctx = document.getElementById('canvasChart').getContext('2d');
            if (miGrafico) { miGrafico.destroy(); }
            miGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: x,
                    datasets: [{
                        label: 'Voltaje de Batería (V)',
                        data: y,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: '#ef4444',
                        tension: 0.1
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#374151' } },
                        y: { grid: { color: '#374151' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
